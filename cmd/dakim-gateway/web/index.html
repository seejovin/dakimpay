<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dakim pay · Merchant register</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head><body>
<header><strong>dakim pay</strong><span>Virtual merchant register</span><button id="disconnect" class="quiet" hidden>Disconnect</button></header>
<main>
<section id="login"><h1>Merchant register</h1><form id="login-form"><label>Merchant credential<input id="token" type="password" autocomplete="off" required></label><button>Connect</button></form></section>
<section id="register" hidden><div class="title"><div><span class="kicker" id="merchant"></span><h1>Merchant register</h1></div><span class="currency" id="currency"></span></div>
<div class="columns"><article><h2>New payment</h2><form id="sale"><label>Order reference<input name="order" maxlength="80" required></label><label>Amount <span id="units"></span><input name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" required></label><label>Channel<select name="channel"><option value="terminal">Virtual terminal</option><option value="hosted">Hosted checkout</option></select></label><label id="method-label" hidden>Payment method<select name="method"></select></label><label>Outlet<select name="outlet"></select></label><label id="device-label">Reader<select name="terminal"></select></label><button id="submit-sale">Create payment</button></form></article>
<article><h2>Payment status</h2><p id="empty">Create a payment or open it using its original reference.</p><div id="detail" hidden><span id="status" class="status"></span><p class="total" id="total"></p><dl><dt>Order</dt><dd id="order"></dd><dt>Payment ID</dt><dd id="payment-id"></dd><dt id="method-title" hidden>Method / card brand</dt><dd id="method-value" hidden></dd><dt id="route-title" hidden>Processor route</dt><dd id="route-value" hidden></dd><dt>Processor reference</dt><dd id="reference"></dd><dt>Refunded / reserved</dt><dd id="refunded"></dd></dl><p id="instruction"></p><a id="checkout" target="_blank" rel="noopener noreferrer" hidden>Open buyer checkout</a><form id="refund" hidden><label>Refund amount<input name="amount" inputmode="decimal" required></label><button>Request refund</button></form></div><form id="lookup"><label>Open existing payment<input name="id" placeholder="pi_…" autocomplete="off" required></label><button class="quiet">Open</button></form></article></div>
<article class="activity"><div class="title"><h2>Payment activity</h2><button class="quiet" id="refresh">Refresh</button></div><div id="events"></div></article></section>
<p id="notice" role="status" aria-live="polite"></p>
</main></body></html>
